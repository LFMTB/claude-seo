services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.preview
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["python", "preview_server.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    environment:
      - BASE44_PREVIEW_MODE
